# Shared base services for hosts/*/monitoring/compose.yaml (via `extends`).
# Not a stack on its own. Host files add ports, networks, labels and any
# host-specific volumes. The file name starts with "compose" so Renovate's
# docker-compose manager keeps updating the images below.

services:
  cadvisor:
    container_name: cadvisor
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /etc/machine-id:/etc/machine-id:ro
    command:
      - '-disable_metrics=percpu,sched,tcp,udp,diskIO,process,referenced_memory'
      - '-store_container_labels=false'
      - '-whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service'
      - '-docker_only=true'
    devices:
      - /dev/kmsg:/dev/kmsg
    privileged: true

  alloy:
    container_name: alloy
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    restart: unless-stopped
    volumes:
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Host root for the unix exporter's filesystem metrics (cadvisor already
      # has the same read-only view).
      - /:/host:ro,rslave
      - ./alloy/config.river:/etc/alloy/config.river:ro
      - ${DOCKER_DATA_DIR}/alloy-data:/var/lib/alloy/data
    pid: host
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.river
    user: root
