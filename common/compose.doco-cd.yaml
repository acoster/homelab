# Shared base service for hosts/*/doco-cd/compose.yaml (via `extends`).
# Not a stack on its own. Host files add POLL_CONFIG (their target), ports,
# networks and labels. The file name starts with "compose" so Renovate's
# docker-compose manager keeps updating the image below.

services:
  doco-cd:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:0.134.0@sha256:1d40f570403689c762c63009ade3d5d0dc24595bf40f9629a8ab3865e4ddb768
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA_DIR}/doco-cd:/data
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
      SOPS_AGE_KEY: ${SOPS_AGE_KEY}
      SELF_UPDATE_ENABLED: 'true'
      MAX_CONCURRENT_DEPLOYMENTS: 1
      GIT_AUTH_TOKEN: ${GIT_AUTH_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_TOKEN}
