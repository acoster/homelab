name: CI

# Runs on every branch push, including renovate/* branches that Renovate
# automerges without opening a PR.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install pyyaml==6.0.3
      - run: docker compose version
      - run: python .github/scripts/validate.py

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --version
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning --format=gcc

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # Versions come from package.json (Renovate keeps them current).
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Prettier
        run: npx prettier --check .
      - name: DCLint
        if: ${{ !cancelled() }}
        run: npx dclint -r .
      - name: shfmt
        if: ${{ !cancelled() }}
        uses: docker://mvdan/shfmt:v3.14.1@sha256:8c06884a35683d8763fba6c0d9484d11a61a96da65f8d497d6f625825a6043f2
        with:
          args: -d hosts

  docgen:
    name: Docs generator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/docgen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/docgen/go.mod
          cache-dependency-path: tools/docgen/go.sum
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...
      # docs/generated/ is committed; fail when a compose or template change
      # leaves it stale (fix: `go -C tools/docgen run .`).
      - name: Generated docs are up to date
        run: go run . -check
      - name: No conflicting ports, addresses or names
        run: go run . -lint

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: dir --no-banner --redact --verbose .
