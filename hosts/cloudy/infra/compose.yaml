name: infra

services:
  # The only container with the Docker socket. Traefik is internet-facing, so it
  # talks to this filter instead: it may list/inspect containers and watch
  # events (GET only), and nothing else. A `:ro` socket mount would not stop
  # a process from creating containers through the API.
  socket-proxy:
    container_name: 'socket-proxy'
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    privileged: true # upstream's recommendation; needed to connect to the socket under SELinux/AppArmor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONTAINERS: '1'
      # EVENTS, PING and VERSION are on by default; POST and everything else is off.
    networks:
      socket-proxy:

  traefik:
    container_name: 'traefik'
    image: traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    restart: unless-stopped
    ports:
      - '80:80/tcp'
      - '80:80/udp'
      - '443:443/tcp'
      - '443:443/udp'
    depends_on:
      - socket-proxy
    volumes:
      - ${DOCKER_DATA_DIR}/acme.json:/letsencrypt/acme.json
    environment:
      CF_DNS_API_TOKEN: ${CF_API_TOKEN}
    env_file:
      - ./.env
    networks:
      servers:
      socket-proxy:
    labels:
      traefik.enable: 'true'
      # Traefik v3 HostRegexp takes a plain Go regex; `$$` is a literal `$` for compose.
      traefik.http.routers.wildcard-certs.rule: HostRegexp(`^.+$$`)
      traefik.http.routers.wildcard-certs.entrypoints: https
      traefik.http.routers.wildcard-certs.service: noop@internal
    command:
      # Global configuration
      - '--global.checknewversion=false'
      - '--global.sendanonymoususage=false'
      - '--log.format=common'

      # Entrypoints & automatic HTTP -> HTTPS redirect
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entrypoint.to=https'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--entrypoints.https.address=:443'

      - '--entrypoints.https.http.tls.certresolver=cloudflare'
      - '--entrypoints.https.http.tls.domains[0].main=${DOMAIN}'
      - '--entrypoints.https.http.tls.domains[0].sans=*.${DOMAIN}'

      # Cloudflare DNS-01 ACME Resolver
      - '--certificatesresolvers.cloudflare.acme.email=${CF_API_EMAIL}'
      - '--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json'
      - '--certificatesresolvers.cloudflare.acme.dnschallenge=true'
      - '--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare'
      - '--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53'
      - '--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=10'

      # Docker Provider
      - '--providers.docker=true'
      - '--providers.docker.endpoint=tcp://socket-proxy:2375'
      - '--providers.docker.exposedbydefault=false'

networks:
  servers:
    name: servers
    external: true
  socket-proxy:
    name: socket-proxy
    internal: true
