name: infra

services:
  # The only container with the Docker socket. Traefik is internet-facing, so it
  # talks to this filter instead: it may list/inspect containers and watch
  # events (GET only), and nothing else. A `:ro` socket mount would not stop
  # a process from creating containers through the API.
  socket-proxy:
    container_name: 'socket-proxy'
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    privileged: true # upstream's recommendation; needed to connect to the socket under SELinux/AppArmor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONTAINERS: '1'
      # EVENTS, PING and VERSION are on by default; POST and everything else is off.
    networks:
      socket-proxy:

  traefik:
    container_name: 'traefik'
    image: traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    restart: unless-stopped
    ports:
      - '80:80/tcp'
      - '80:80/udp'
      - '443:443/tcp'
      - '443:443/udp'
    depends_on:
      - socket-proxy
    volumes:
      # A directory, not a file: a missing file bind-mounts as a directory, and an
      # existing one is usually 0644; Traefik disables the resolver in both cases.
      # Traefik creates acme.json here itself, with mode 0600.
      - ${DOCKER_DATA_DIR}/traefik:/letsencrypt
    env_file:
      - ./.env
    networks:
      servers:
      socket-proxy:
    command:
      # Global configuration
      - '--global.checknewversion=false'
      - '--global.sendanonymoususage=false'
      - '--log.format=common'

      # Entrypoints & automatic HTTP -> HTTPS redirect
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entrypoint.to=https'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--entrypoints.https.address=:443'

      # Every router on https gets its own certificate for the names in its
      # Host() rule. No wildcard: only a handful of hostnames live here.
      - '--entrypoints.https.http.tls.certresolver=letsencrypt'

      # HTTP-01 on :80. Traefik's challenge router outranks the redirect above.
      # Each hostname must resolve to this VPS before its router appears.
      - '--certificatesresolvers.letsencrypt.acme.email=${CF_API_EMAIL}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web'

      # Docker Provider
      - '--providers.docker=true'
      - '--providers.docker.endpoint=tcp://socket-proxy:2375'
      - '--providers.docker.exposedbydefault=false'

networks:
  servers:
    name: servers
    external: true
  socket-proxy:
    name: socket-proxy
    internal: true
