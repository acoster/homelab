name: doco-cd

services:
  doco-cd:
    extends:
      file: ../../../common/compose.doco-cd.yaml
      service: doco-cd
    environment:
      POLL_CONFIG: |
        - url: https://github.com/acoster/homelab.git
          reference: main
          interval: 1800
          target: raspberry
    networks:
      servers:
    labels:
      traefik.enable: 'true'
      traefik.http.routers.hook-raspberry.rule: Host(`${WEBHOOK_HOST}.${DOMAIN}`)
      traefik.http.routers.hook-raspberry.entrypoints: https
      traefik.http.services.hook-raspberry.loadbalancer.server.port: '80'

networks:
  # Owned by this stack so doco-cd can bootstrap a blank host on its own. The other
  # stacks (infra, apps, monitoring) mark it external.
  servers:
    name: servers
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          ip_range: 172.18.1.0/24
          gateway: 172.18.0.1
