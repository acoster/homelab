name: doco-cd

services:
  doco-cd:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:0.131.0@sha256:33761af0adb58696bf7892604a4a319cee6164aa5cb17e5b4b4f5c8cb248a603
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA_DIR}/doco-cd:/data
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
      SOPS_AGE_KEY: ${SOPS_AGE_KEY}
      SELF_UPDATE_ENABLED: "true"
      MAX_CONCURRENT_DEPLOYMENTS: 1
      GIT_AUTH_TOKEN: ${GIT_AUTH_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_TOKEN}
      POLL_CONFIG: |
        - url: https://github.com/acoster/homelab.git
          reference: main
          interval: 1800
          target: raspberry
    networks:
      servers:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hook-raspberry.rule=Host(`${WEBHOOK_HOST}.${DOMAIN}`)"
      - "traefik.http.routers.hook-raspberry.entrypoints=https"
      - "traefik.http.services.hook-raspberry.loadbalancer.server.port=80"

networks:
  servers:
    name: servers
    external: true
