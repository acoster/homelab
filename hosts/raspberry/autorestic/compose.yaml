services:
  autorestic:
    container_name: autorestic
    image: cupcakearmy/autorestic:latest@sha256:0a826ea59ca452dadae50e618c0a14800450c920d22da0e35cb23e7a8be36d1f

    restart: unless-stopped
    volumes:
      - ./autorestic.yml:/root/.config/autorestic/.autorestic.yml
      - ./autorestic.lock.yml:/root/.config/autorestic/.autorestic.lock.yml

      # Docker stuff that gets backed up
      - ${DOCKER_DATA_DIR}:/backup_source/bind_mounts:ro
      - ${DOCKER_DATA_DIR}/restic-ssh:/root/.ssh:ro

      # Stuff from the host that gets backed up
      - /etc/apt:/backup_source/host/etc/apt:ro
      - /etc/exim4:/backup_source/host/etc/exim4:ro
      - /etc/group:/backup_source/host/etc/group:ro
      - /etc/NetworkManager:/backup_source/host/etc/NetworkManager:ro
      - /etc/passwd:/backup_source/host/etc/passwd:ro
      - /etc/shadow:/backup_source/host/etc/shadow:ro
      - /etc/systemd/system/:/backup_source/host/etc/systemd/system/:ro
      - /var/spool/cron/crontabs/:/backup_source/host/var/spool/cron/crontabs/:ro
    environment:
      AUTORESTIC_RSYNCNET_RESTIC_PASSWORD:
      AUTORESTIC_DATENGRAB_RESTIC_PASSWORD:
      HC_PING_URL:
    env_file:
      - ./.env
    hostname: autorestic-agent-raspberry # Change per host
