scrape_configs:
  - job_name: "victoriametrics"
    static_configs:
      - targets: ["localhost:8428"]

  - job_name: "cadvisor"
    max_scrape_size: 64MB
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: "raspberry"
      - targets: ["framboesa:8081"]
        labels:
          instance: "framboesa"
      - targets: ["datengrab:8787"]
        labels:
          instance: "datengrab"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "^container_network_advance_tcp_stats_total$"
        action: drop
      - source_labels: [image]
        regex: "([^@]+)(@.*)?"
        target_label: image
        replacement: "$1"
        action: replace

  - job_name: "bambuddy"
    static_configs:
      - targets: ["bambuddy:8000"]
    bearer_token: "%{BAMBUDDY_TOKEN}"
    scheme: http
    metrics_path: "/api/v1/metrics"
    metric_relabel_configs:
      - action: labeldrop
        regex: "serial"

  - job_name: "hass"
    static_configs:
      - targets: ["hass:8123"]
    bearer_token: "%{VM_HASS_TOKEN}"
    scheme: http
    metrics_path: "/api/prometheus"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "hass_(state_change_created|state_change_total|entity_available|last_updated_time_seconds|entity_info)"
        action: drop

  - job_name: "jellyfin"
    # Direct to the macvlan IP: /metrics is blocked on the public Traefik router.
    static_configs:
      - targets: ["192.168.1.231:8096"]
        labels:
          instance: "datengrab"

  - job_name: "healthchecks"
    scheme: https
    metrics_path: "/projects/%{HC_PROJECT}/metrics/%{HC_TOKEN}"
    static_configs:
      - targets: ["healthchecks.io"]
