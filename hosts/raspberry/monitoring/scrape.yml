scrape_configs:
  - job_name: "victoriametrics"
    static_configs:
      - targets: ["localhost:8428"]

  - job_name: "cadvisor"
    max_scrape_size: 64MB
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: "raspberry"
      - targets: ["framboesa:8081"]
        labels:
          instance: "framboesa"
      - targets: ["datengrab:8787"]
        labels:
          instance: "datengrab"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "^container_network_advance_tcp_stats_total$"
        action: drop
      - source_labels: [image]
        regex: "([^@]+)(@.*)?"
        target_label: image
        replacement: "$1"
        action: replace

  - job_name: "bambuddy"
    static_configs:
      - targets: ["bambuddy:8000"]
    bearer_token: "%{BAMBUDDY_TOKEN}"
    scheme: "http"
    metrics_path: "/api/v1/metrics"
    metric_relabel_configs:
      - action: labeldrop
        regex: "serial"
