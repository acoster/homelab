scrape_configs:
  - job_name: "victoriametrics"
    static_configs:
      - targets: ["localhost:8428"]
  - job_name: "cadvisor"
    max_scrape_size: 64MB
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: "raspberry"
      - targets: ["framboesa:8081"]
        labels:
          instance: "framboesa"
