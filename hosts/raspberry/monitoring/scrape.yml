scrape_configs:
  - job_name: "victoriametrics"
    metric_relabel_configs:
      - &drop_go_metrics
        source_labels: [__name__]
        regex: "^go_.*"
        action: drop

    static_configs:
      - targets: ["localhost:8428"]

  - job_name: "cadvisor"
    max_scrape_size: 64MB
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: "raspberry"
      - targets: ["192.168.1.39:8081"]
        labels:
          instance: "framboesa"
      - targets: ["datengrab:8787"]
        labels:
          instance: "datengrab"
    metric_relabel_configs:
      - *drop_go_metrics
      - source_labels: [__name__]
        regex: "^container_network_advance_tcp_stats_total$"
        action: drop
      - source_labels: [image]
        regex: "([^@]+)(@.*)?"
        target_label: image
        replacement: "$1"
        action: replace

  # Host metrics from each host's alloy (prometheus.exporter.unix in common/alloy/config.river).
  - job_name: "node"
    metrics_path: "/api/v0/component/prometheus.exporter.unix.host/metrics"
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          instance: "raspberry"
      - targets: ["192.168.1.39:12345"]
        labels:
          instance: "framboesa"
      - targets: ["datengrab:12345"]
        labels:
          instance: "datengrab"

  # SMART data for raspberry's NVMe drive (smartctl-exporter in the monitoring
  # stack). framboesa boots from an SD card, which has no SMART data; its wear
  # proxy is node_disk_written_bytes_total{device="mmcblk0"} from the node job.
  - job_name: "smartctl"
    metric_relabel_configs: [*drop_go_metrics]
    static_configs:
      - targets: ["smartctl-exporter:9633"]
        labels:
          instance: "raspberry"

  - job_name: "doco-cd"
    metrics_path: "/metrics"
    scheme: http
    metric_relabel_configs: [*drop_go_metrics]
    static_configs:
      - targets: ["doco-cd:9120"]
        labels:
          instance: "raspberry"
      - targets: ["192.168.1.39:9120"]
        labels:
          instance: "framboesa"
      - targets: ["datengrab:9120"]
        labels:
          instance: "datengrab"

  # Host network interfaces: a second exporter in the same alloy that reads PID 1's
  # network namespace (see common/alloy/config.river).
  - job_name: "node_net"
    metrics_path: "/api/v0/component/prometheus.exporter.unix.hostnet/metrics"
    # Dashboards filter every panel by one job ("node"). Rewrite the label on the
    # samples only, so the "up" series of the two jobs stay distinct.
    metric_relabel_configs:
      - target_label: job
        replacement: "node"
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          instance: "raspberry"
      - targets: ["192.168.1.39:12345"]
        labels:
          instance: "framboesa"
      - targets: ["datengrab:12345"]
        labels:
          instance: "datengrab"

  # Reached over the shared "servers" network, so none of these ports are published.
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8080"]
    metric_relabel_configs:
      - *drop_go_metrics

  # Technitium's native Prometheus endpoint (v15+): server-wide lifetime counters.
  # The token belongs to a user in a group limited to Dashboard "View"; the same
  # token is created on both servers. ns0 is reached over the shared "servers"
  # network, ns1 on its macvlan address.
  - job_name: "technitium"
    metrics_path: "/api/dashboard/metrics/text"
    scheme: http
    bearer_token: "%{TECHNITIUM_METRICS_TOKEN}"
    static_configs:
      - targets: ["technitium:5380"]
        labels:
          instance: "raspberry"
      - targets: ["192.168.5.202:5380"]
        labels:
          instance: "framboesa"

  - job_name: "authentik"
    static_configs:
      - targets: ["authentik_server:9300"]

  - job_name: "crowdsec"
    static_configs:
      - targets: ["crowdsec:6060"]
    metric_relabel_configs:
      - *drop_go_metrics

  - job_name: "bambuddy"
    static_configs:
      - targets: ["bambuddy:8000"]
    bearer_token: "%{BAMBUDDY_TOKEN}"
    scheme: http
    metrics_path: "/api/v1/metrics"
    metric_relabel_configs:
      - action: labeldrop
        regex: "serial"

  - job_name: "hass"
    static_configs:
      - targets: ["hass:8123"]
    bearer_token: "%{VM_HASS_TOKEN}"
    scheme: http
    metrics_path: "/api/prometheus"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "hass_(state_change_created|state_change_total|entity_available|last_updated_time_seconds|entity_info)"
        action: drop

  # Sessions, streams, library counts and transcoding from the Jellyfin API.
  - job_name: "jellyfin_exporter"
    static_configs:
      - targets: ["jellyfin_exporter:9594"]
        labels:
          instance: "datengrab"
    metric_relabel_configs:
      - *drop_go_metrics

  - job_name: "healthchecks"
    scheme: https
    metrics_path: "/projects/%{HC_PROJECT}/metrics/%{HC_TOKEN}"
    static_configs:
      - targets: ["healthchecks.io"]
