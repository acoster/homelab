storage:
  type: sqlite
  path: /data/data.db

x-templates:
  arr-conditions: &arr-healthy
    - "[STATUS] == 200"
    - "[BODY].status == OK"
  http-healthy: &http-healthy
    - "[STATUS] == 200"
  json-healthy: &json-healthy
    - "[STATUS] == 200"
    - "[BODY].status == healthy"
  connected-healthy: &connected-healthy
    - "[CONNECTED] == true"

endpoints:
  # Infra services
  - name: framboesa-dns
    group: infra
    url: 192.168.5.202
    dns:
      query-name: google.com
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
  - name: authentik
    group: infra
    url: ${AUTHENTIK_URL}
    conditions: *http-healthy
  - name: traefik
    group: infra
    url: ${TRAEFIK_URL}
    conditions: *http-healthy
  - name: technitium
    group: infra
    url: ${TECHNITIUM_URL}
    conditions: *http-healthy

  # 3D printing services/devices
  - name: bambuddy
    group: 3d-printing
    url: ${BAMBUDDY_URL}
    conditions: *json-healthy
  - name: manyfold
    group: 3d-printing
    url: ${MANYFOLD_URL}
    conditions: *http-healthy
  - name: slicer-api
    group: 3d-printing
    url: ${SLICER_API_URL}
    conditions: *json-healthy
  - name: spoolman
    group: 3d-printing
    url: ${SPOOLMAN_URL}
    conditions: *json-healthy
  - name: wondertainment
    group: 3d-printing
    url: icmp://wondertainment.home.coster.ch
    conditions: *connected-healthy

  # Media services
  - name: jellyfin
    group: media
    url: ${JELLYFIN_URL}
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"

  - name: lidarr
    group: media
    url: https://lid${ARR_SUFFIX}
    conditions: *arr-healthy
  - name: radarr
    group: media
    url: https://rad${ARR_SUFFIX}
    conditions: *arr-healthy
  - name: sonarr
    group: media
    url: https://son${ARR_SUFFIX}
    conditions: *arr-healthy
  - name: prowlarr
    group: media
    url: https://prowl${ARR_SUFFIX}
    conditions: *arr-healthy

  # Home automation
  - name: home-assistant
    group: home
    url: ${HASS_URL}
    headers:
      Authorization: "Bearer ${HASS_TOKEN}"

security:
  oidc:
    issuer-url: ${GATUS_OIDC_ISSUER_URL}
    client-id: "${GATUS_OIDC_CLIENT_ID}"
    client-secret: "${GATUS_OIDC_SECRET}"
    redirect-url: ${GATUS_OIDC_CALLBACK}
    scopes: ["openid"]
