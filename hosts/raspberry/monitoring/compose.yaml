name: monitoring

services:
  gatus:
    container_name: gatus
    image: twinproduction/gatus:v5.37.0
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/gatus:/data
      - ./gatus.yaml:/gatus.yaml:ro
    environment:
      GATUS_CONFIG_PATH: /gatus.yaml
      GATUS_OIDC_CLIENT_ID: ${GATUS_OIDC_CLIENT_ID}
      GATUS_OIDC_SECRET: ${GATUS_OIDC_SECRET}
    env_file:
      - .env
    networks:
      servers:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gatus.rule=Host(`gatus.${DOMAIN}`)"
      - "traefik.http.routers.gatus.entrypoints=https"
      - "traefik.http.services.gatus.loadbalancer.server.port=8080"

networks:
  servers:
    name: servers
    external: true
