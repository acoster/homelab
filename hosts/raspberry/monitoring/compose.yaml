name: monitoring

services:
  gatus:
    container_name: gatus
    image: twinproduction/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/gatus:/data
      - ./gatus.yaml:/gatus.yaml:ro
    environment:
      GATUS_CONFIG_PATH: /gatus.yaml
      ARR_SUFFIX: ${ARR_SUFFIX}
      AUTHENTIK_URL: ${AUTHENTIK_URL}
      BAMBUDDY_URL: ${BAMBUDDY_URL}
      HASS_TOKEN: ${HASS_TOKEN}
      HASS_URL: ${HASS_URL}
      HUE_HOST: ${HUE_HOST}
      JELLYFIN_URL: ${JELLYFIN_URL}
      SAB_URL: ${SAB_URL}
      SLICER_API_URL: ${SLICER_API_URL}
      SPOOLMAN_URL: ${SPOOLMAN_URL}
      TECHNITIUM_URL: ${TECHNITIUM_URL}
      THERMOSTAT_HOST: ${THERMOSTAT_HOST}
      TRAEFIK_URL: ${TRAEFIK_URL}
      TRANSMISSION_AUTH: ${TRANSMISSION_AUTH}
      TRANSMISSION_URL: ${TRANSMISSION_URL}
      BRICKTRACKER_URL: ${BRICKTRACKER_URL}
      BYTESTASH_URL: ${BYTESTASH_URL}
      HBOX_URL: ${HBOX_URL}
      LINKDING_URL: ${LINKDING_URL}
      MINIFLUX_URL: ${MINIFLUX_URL}
    env_file:
      - .env
    networks:
      servers:
    labels:
      traefik.enable: 'true'
      traefik.http.routers.gatus.rule: Host(`gatus.${DOMAIN}`)
      traefik.http.routers.gatus.entrypoints: https
      traefik.http.routers.gatus.middlewares: middlewares-authentik@file
      traefik.http.routers.gatus.service: gatus-svc
      traefik.http.routers.gatus-local.rule: Host(`gatus.${DOMAIN}`) && ClientIP(`192.168.0.0/16`)
      traefik.http.routers.gatus-local.entrypoints: https
      traefik.http.routers.gatus-local.service: gatus-svc
      traefik.http.services.gatus-svc.loadbalancer.server.port: '8080'

  victoriametrics:
    container_name: victoriametrics
    image: victoriametrics/victoria-metrics:v1.156.0@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/vm-data:/storage
      - ./scrape.yml:/etc/victoriametrics/scrape.yml:ro
    environment:
      BAMBUDDY_TOKEN:
      VM_HASS_TOKEN:
      HC_TOKEN:
      HC_PROJECT:
    networks:
      servers:
        gw_priority: 0
      monitoring-internal:
    labels:
      traefik.enable: 'true'
      traefik.http.routers.vm.rule: Host(`vm.${DOMAIN}`)
      traefik.http.routers.vm.entrypoints: https
      traefik.http.routers.vm.middlewares: middlewares-authentik@file
      traefik.http.routers.vm.service: vm-svc
      traefik.http.routers.vm-local.rule: Host(`vm.${DOMAIN}`) && ClientIP(`192.168.1.0/24`) && !ClientIP(`192.168.1.1`)
      traefik.http.routers.vm-local.entrypoints: https
      traefik.http.routers.vm-local.service: vm-svc
      traefik.http.services.vm-svc.loadbalancer.server.port: '8428'
      traefik.docker.network: servers
    command:
      - '-storageDataPath=/storage'
      - '-retentionPeriod=3M'
      - '-promscrape.config=/etc/victoriametrics/scrape.yml'

  victorialogs:
    container_name: victorialogs
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    restart: unless-stopped
    ports:
      - '514:514/tcp'
      - '9428:9428/tcp'
    volumes:
      - ${DOCKER_DATA_DIR}/vlogs-data:/victoria-logs-data
    networks:
      servers:
        gw_priority: 0
      monitoring-internal:
    labels:
      traefik.enable: 'true'
      traefik.http.routers.vlogs.rule: Host(`vlogs.${DOMAIN}`)
      traefik.http.routers.vlogs.entrypoints: https
      traefik.http.routers.vlogs.middlewares: middlewares-authentik@file
      traefik.http.routers.vlogs.service: vlogs-svc
      traefik.http.routers.vlogs-local.rule: Host(`vlogs.${DOMAIN}`) && ClientIP(`192.168.1.0/24`) && !ClientIP(`192.168.1.1`)
      traefik.http.routers.vlogs-local.entrypoints: https
      traefik.http.routers.vlogs-local.service: vlogs-svc
      traefik.http.services.vlogs-svc.loadbalancer.server.port: '9428'
      traefik.docker.network: servers
    command:
      - '-storageDataPath=/victoria-logs-data'
      - '-retentionPeriod=14d'
      - '-retention.maxDiskSpaceUsageBytes=50GiB'
      - '-syslog.listenAddr.tcp=:514'

  grafana:
    container_name: grafana
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    restart: unless-stopped
    depends_on:
      - victoriametrics
    volumes:
      - ${DOCKER_DATA_DIR}/grafana-data:/var/lib/grafana
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_AUTH_GENERIC_OAUTH_NAME: 'Corp SSO'
      GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: 'openid profile email entitlements'
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: '${OAUTH_ROOT}/authorize/'
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: '${OAUTH_ROOT}/token/'
      GF_AUTH_GENERIC_OAUTH_API_URL: '${OAUTH_ROOT}/userinfo/'
      GF_AUTH_SIGNOUT_REDIRECT_URL: '${OAUTH_ROOT}/grafana/end-session/'
      GF_AUTH_OAUTH_AUTO_LOGIN: 'true'
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: 'true'
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'"
      GF_INSTALL_PLUGINS: victoriametrics-metrics-datasource,victoriametrics-logs-datasource
    networks:
      servers:
      monitoring-internal:
    labels:
      traefik.enable: 'true'
      traefik.http.routers.grafana.rule: Host(`grafana.${DOMAIN}`)
      traefik.http.routers.grafana.service: grafana-svc
      traefik.http.services.grafana-svc.loadbalancer.server.port: '3000'
      traefik.docker.network: servers

  cadvisor:
    extends:
      file: ../../../common/compose.monitoring.yaml
      service: cadvisor
    volumes:
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      monitoring-internal:

  alloy:
    extends:
      file: ../../../common/compose.monitoring.yaml
      service: alloy
    environment:
      VLOGS_URL: http://victorialogs:9428
    env_file:
      - .env
    networks:
      servers:
    labels:
      traefik.enable: true
      traefik.http.routers.alloy-raspberry.rule: 'Host(`alloy-raspberry.${DOMAIN}`)'
      traefik.http.routers.alloy-raspberry.entrypoints: https
      traefik.http.routers.alloy-raspberry.middlewares: 'middlewares-authentik@file'
      traefik.http.routers.alloy-raspberry.service: alloy-raspberry-svc
      traefik.http.services.alloy-raspberry-svc.loadbalancer.server.port: 12345

networks:
  servers:
    name: servers
    external: true
  monitoring-internal:
    name: monitoring-internal
    internal: true
