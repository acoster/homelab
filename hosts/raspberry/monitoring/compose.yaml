name: monitoring

services:
  gatus:
    container_name: gatus
    image: twinproduction/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/gatus:/data
      - ./gatus.yaml:/gatus.yaml:ro
    environment:
      GATUS_CONFIG_PATH: /gatus.yaml
      ARR_SUFFIX: ${ARR_SUFFIX}
      AUTHENTIK_URL: ${AUTHENTIK_URL}
      BAMBUDDY_URL: ${BAMBUDDY_URL}
      HASS_TOKEN: ${HASS_TOKEN}
      HASS_URL: ${HASS_URL}
      HUE_HOST: ${HUE_HOST}
      JELLYFIN_URL: ${JELLYFIN_URL}
      MANYFOLD_URL: ${MANYFOLD_URL}
      SAB_URL: ${SAB_URL}
      SLICER_API_URL: ${SLICER_API_URL}
      SPOOLMAN_URL: ${SPOOLMAN_URL}
      TECHNITIUM_URL: ${TECHNITIUM_URL}
      THERMOSTAT_HOST: ${THERMOSTAT_HOST}
      TRAEFIK_URL: ${TRAEFIK_URL}
      TRANSMISSION_AUTH: ${TRANSMISSION_AUTH}
      TRANSMISSION_URL: ${TRANSMISSION_URL}
      BRICKTRACKER_URL: ${BRICKTRACKER_URL}
      BYTESTASH_URL: ${BYTESTASH_URL}
      HBOX_URL: ${HBOX_URL}
      LINKDING_URL: ${LINKDING_URL}
      MINIFLUX_URL: ${MINIFLUX_URL}
    env_file:
      - .env
    networks:
      servers:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gatus.rule=Host(`gatus.${DOMAIN}`)"
      - "traefik.http.routers.gatus.entrypoints=https"
      - "traefik.http.routers.gatus.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.gatus.service=gatus-svc"
      - "traefik.http.routers.gatus-local.rule=Host(`gatus.${DOMAIN}`) && ClientIP(`192.168.0.0/16`)"
      - "traefik.http.routers.gatus-local.entrypoints=https"
      - "traefik.http.routers.gatus-local.service=gatus-svc"
      - "traefik.http.services.gatus-svc.loadbalancer.server.port=8080"

  victoriametrics:
    container_name: victoriametrics
    image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/vm-data:/storage
      - ./scrape.yml:/etc/victoriametrics/scrape.yml:ro
    networks:
      monitoring-internal:
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=3M"
      - "-promscrape.config=/etc/victoriametrics/scrape.yml"

  grafana:
    container_name: grafana
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    restart: unless-stopped
    depends_on:
      - victoriametrics
    volumes:
      - ${DOCKER_DATA_DIR}/grafana-data:/var/lib/grafana
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_AUTH_GENERIC_OAUTH_NAME: 'Corp SSO'
      GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email entitlements"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "${OAUTH_ROOT}/authorize/"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "${OAUTH_ROOT}/token/"
      GF_AUTH_GENERIC_OAUTH_API_URL: "${OAUTH_ROOT}/userinfo/"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "${OAUTH_ROOT}/grafana/end-session/"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'"
    networks:
      servers:
      monitoring-internal:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.service=grafana-svc"
      - "traefik.http.services.grafana-svc.loadbalancer.server.port=3000"
      - "traefik.docker.network=servers"

  cadvisor:
    container_name: cadvisor
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      monitoring-internal:
    command:
      - "-disable_metrics=percpu,sched,tcp,udp,diskIO,process,referenced_memory"
      - "-store_container_labels=false"
      - "-whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service"
      - '-docker_only=true'
    devices:
      - /dev/kmsg:/dev/kmsg
    privileged: true

networks:
  servers:
    name: servers
    external: true
  monitoring-internal:
    name: monitoring-internal
    internal: true
