name: monitoring

services:
  gatus:
    container_name: gatus
    image: twinproduction/gatus:v5.38.0
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/gatus:/data
      - ./gatus.yaml:/gatus.yaml:ro
    environment:
      GATUS_CONFIG_PATH: /gatus.yaml
      GATUS_OIDC_CLIENT_ID: ${GATUS_OIDC_CLIENT_ID}
      GATUS_OIDC_SECRET: ${GATUS_OIDC_SECRET}
      AUTHENTIK_URL: ${AUTHENTIK_URL}
      TRAEFIK_URL: ${TRAEFIK_URL}
      TECHNITIUM_URL: ${TECHNITIUM_URL}
      BAMBUDDY_URL: ${BAMBUDDY_URL}
      MANYFOLD_URL: ${MANYFOLD_URL}
      SLICER_API_URL: ${SLICER_API_URL}
      JELLYFIN_URL: ${JELLYFIN_URL}
      ARR_SUFFIX: ${ARR_SUFFIX}
      SPOOLMAN_URL: ${SPOOLMAN_URL}
      GATUS_OIDC_ISSUER_URL: ${GATUS_OIDC_ISSUER_URL}
      GATUS_OIDC_CALLBACK: ${GATUS_OIDC_CALLBACK}
      HUE_HOST: ${HUE_HOST}
      HASS_URL: ${HASS_URL}
      HASS_TOKEN: ${HASS_TOKEN}
    env_file:
      - .env
    networks:
      servers:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gatus.rule=Host(`gatus.${DOMAIN}`)"
      - "traefik.http.routers.gatus.entrypoints=https"
      - "traefik.http.services.gatus.loadbalancer.server.port=8080"

  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2.5.8
    volumes:
      - ${DOCKER_DATA_DIR}/kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    networks:
      servers:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`uptime.${DOMAIN}`)"
      - "traefik.http.routers.uptime.entrypoints=https"
      - "traefik.http.routers.uptime.middlewares=middlewares-authentik@file"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
      - "traefik.http.routers.uptime-status.rule=Host(`uptime.${DOMAIN}`) && PathRegexp(`^/(status/.*|assets/.+|api/status-page/.+|icon.svg)`)"
      - "traefik.http.routers.uptime-status.entrypoints=https"
      - "traefik.http.routers.uptime-status.service=uptime@docker"

networks:
  servers:
    name: servers
    external: true
