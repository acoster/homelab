apiVersion: 1

datasources:
  - name: prometheus
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: false
    uid: prometheus-native

  - name: VictoriaMetrics
    type: victoriametrics-metrics-datasource
    access: proxy
    url: http://victoriametrics:8428
    uid: victoriametrics-plugin
    isDefault: true

  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    uid: victorialogs-plugin
