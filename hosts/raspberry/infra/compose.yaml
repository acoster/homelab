name: infra

services:
  authentik_db:
    container_name: authentik_db
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/authentik-psql:/var/lib/postgresql
    environment:
      POSTGRES_USER: 'authentik'
      POSTGRES_DB: 'authentik'
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    env_file:
      - ./.env
    networks:
      authentik-internal:
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s

  authentik_ldap:
    container_name: authentik_ldap
    image: ghcr.io/goauthentik/ldap:2026.8.5@sha256:4c75bd27918418d2d6fbbfe4581bbd5a199fe38942d24559c4483edd64a1ea87
    restart: unless-stopped
    ports:
      - '${HOST_IP:?}:389:3389'
      - '${HOST_IP:?}:636:6636'
    env_file:
      - ./.env
    environment:
      AUTHENTIK_HOST: https://auth.h.coster.ch
      AUTHENTIK_INSECURE: 'false'
      AUTHENTIK_TOKEN: ${AUTHENTIK_LDAP_TOKEN}
    networks:
      servers:

  authentik_server:
    container_name: authentik_server
    image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    restart: unless-stopped
    depends_on:
      authentik_db:
        condition: service_healthy
    volumes:
      - ${DOCKER_DATA_DIR}/authentik-media:/data
    environment:
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    env_file:
      - ./.env
      - ./authentik.env
    networks:
      servers:
      authentik-internal:
    labels:
      traefik.enable: 'true'
      traefik.docker.network: servers
      traefik.http.routers.authh.rule: Host(`auth.${DOMAIN}`)
      traefik.http.services.authh.loadbalancer.server.port: '9000'
      # Traefik v3 HostRegexp takes a plain Go regex; `$$` is a literal `$` for compose.
      traefik.http.routers.authentik-outpost.rule: HostRegexp(`^[a-z0-9-]+[.]${DOMAIN}$$`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.authentik-outpost.service: authh
    command: server

  authentik_worker:
    container_name: authentik_worker
    image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    restart: unless-stopped
    depends_on:
      authentik_db:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    env_file:
      - ./.env
      - ./authentik.env
    networks:
      servers:
      authentik-internal:
    command: worker

  cloudflare-ddns:
    container_name: cloudflare-ddns
    image: favonia/cloudflare-ddns:1.18.0@sha256:345b41895a8846d74c62d30bd27e61101a754f8ab8da10c68115823883803afb
    restart: always
    environment:
      CLOUDFLARE_API_TOKEN: ${CF_API_TOKEN}
      DOMAINS: ${DOMAIN}
      IP6_PROVIDER: none
    env_file:
      - ./.env
    networks:
      servers:

  crowdsec:
    container_name: crowdsec
    image: crowdsecurity/crowdsec:v1.8.2-debian@sha256:a5642c72127ee93aaac830e9f66891573fa7851b2c721987d9fef13d7d05fdfe
    restart: unless-stopped
    ports:
      - '${HOST_IP:?}:6060:6060'
      - '127.0.0.1:8989:8080'
    volumes:
      - /opt/crowdsec-db:/var/lib/crowdsec/data
      - /opt/crowdsec:/etc/crowdsec
      - /var/log:/run/log:ro
      - ${DOCKER_DATA_DIR}/traefik-logs:/var/log/traefik
    environment:
      PGID: '1000'
      COLLECTIONS: 'crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/unifi crowdsecurity/sshd'
    env_file:
      - ./.env
    networks:
      servers:
    labels:
      traefik.enable: 'false'

  redis:
    container_name: redis
    image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    restart: unless-stopped
    ports:
      - '${HOST_IP:?}:6379:6379'
    volumes:
      - ${DOCKER_DATA_DIR}/redis_cache:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file:
      - ./.env
    networks:
      servers:
    command: >
      sh -cx "
        redis-server
        --save 60 1
        --loglevel warning
        --requirepass \"$$REDIS_PASSWORD\"
        --notify-keyspace-events KEA
      "

  technitium:
    container_name: technitium
    image: technitium/dns-server:15.6.2@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/technitium:/etc/dns
    environment:
      DNS_SERVER_DOMAIN: ns0
    env_file:
      - ./.env
    networks:
      servers:
        gw_priority: 10
      servers_macvlan:
        ipv4_address: 192.168.5.201
        ipv6_address: '2a02:169:4bce:2::201'
        mac_address: '8A:87:A6:C5:DA:6C'
        priority: 0
    labels:
      traefik.enable: 'true'
      traefik.http.routers.ns0.rule: Host(`technitium.${DOMAIN}`)
      traefik.http.services.ns0.loadbalancer.server.port: '5380'
      traefik.docker.network: servers
    extra_hosts:
      auth.${DOMAIN}: 172.18.0.254
    hostname: ns0

  traefik:
    container_name: traefik
    image: traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - '${HOST_IP:?}:80:80/tcp'
      - '${HOST_IP:?}:443:443/tcp'
      - '${HOST_IP:?}:443:443/udp'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-rules:/rules
      - ./traefik:/etc/traefik
      - ${DOCKER_DATA_DIR}/traefik-logs:/logs
      - ${DOCKER_DATA_DIR}/traefik:/var/run/acme
    environment:
      CF_API_EMAIL: ${CF_API_EMAIL}
      CF_DNS_API_TOKEN: ${CF_API_TOKEN}
      CROWDSEC_LAPI_KEY: ${CROWDSEC_LAPI_KEY} # read by traefik-rules/security.yml
    env_file:
      - ./.env
    networks:
      servers:
        ipv4_address: 172.18.0.254 # Safe from sequential DHCP
    labels:
      traefik.enable: 'true'
      traefik.tls.stores.default.defaultgeneratedcert.resolver: gcl
      traefik.tls.stores.default.defaultgeneratedcert.domain.main: ${DOMAIN}
      traefik.tls.stores.default.defaultgeneratedcert.domain.sans: '*.${DOMAIN}'
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: middlewares-authentik@file

networks:
  authentik-internal:
    name: authentik-internal
    internal: true
  servers:
    name: servers
    external: true
  servers_macvlan:
    name: servers_macvlan
    driver: macvlan
    enable_ipv6: true
    driver_opts:
      parent: eth0.5
    ipam:
      config:
        - subnet: 192.168.5.0/24
          gateway: 192.168.5.1
        - subnet: '2a02:169:4bce:2::/64'
          gateway: '2a02:169:4bce:2::1'
