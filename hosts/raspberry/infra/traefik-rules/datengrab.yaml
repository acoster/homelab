http:
  routers:
    router-dsm:
      entryPoints:
        - https
      rule: "Host(`datengrab.h.coster.ch`)"
      service: service-dsm
  services:
    service-dsm:
      loadBalancer:
        passHostHeader: true
        serversTransport: dsm-transport
        servers:
          - url: "https://192.168.1.14:5001"
  serversTransports:
    # DSM serves a self-signed certificate; skip verification for this backend only.
    dsm-transport:
      insecureSkipVerify: true
