http:
  routers:
    router-dsm:
      entryPoints:
        - https
      rule: "Host(`datengrab.h.coster.ch`)" 
      service: service-dsm
  services:
    service-dsm:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "https://192.168.1.14:5001"
  serversTransports:
    jellyfin-transport:
      forwardingTimeouts:
        dialTimeout: "30s"
        responseHeaderTimeout: "0s"
        idleConnTimeout: "90s"
