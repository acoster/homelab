name: framboesa

services:
  bytestash:
    container_name: bytestash
    image: ghcr.io/jordan-dalby/bytestash:1.6.0
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ${DOCKER_DATA_DIR}/bytestash:/data/snippets
    environment:
      ADMIN_USERNAMES: alex
      BASE_PATH: ""
      TOKEN_EXPIRY: 24h
      ALLOW_NEW_ACCOUNTS: "true"
      DISABLE_ACCOUNTS: "false"
      DISABLE_INTERNAL_ACCOUNTS: "true"
      OIDC_ENABLED: "true"
      OIDC_DISPLAY_NAME: "Corp SSO"
      OIDC_ISSUER_URL: https://auth.${DOMAIN}/application/o/byte-stash/
      OIDC_CLIENT_ID: ${BYTESTASH_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${BYTESTASH_OIDC_CLIENT_SECRET}
    env_file:
      - .env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bytestash.rule=Host(`bytestash.${DOMAIN}`)"
      - "traefik.http.routers.bytestash.entrypoints=https"
      - "traefik.http.services.bytestash.loadbalancer.server.port=5000"

  homebridge:
    container_name: homebridge
    image: homebridge/homebridge:2026-10-30
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/homebridge/:/homebridge/
    env_file:
      - .env
    networks:
      public:
      macvlan_1:
        ipv4_address: "192.168.1.241"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homebridge.rule=Host(`homebridge.${DOMAIN}`)"
      - "traefik.http.routers.homebridge.entrypoints=https"
      - "traefik.http.routers.homebridge.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.homebridge.service=homebridge-svc"
      - "traefik.http.routers.homebridge-local.rule=Host(`homebridge.${DOMAIN}`) && ClientIP(`192.168.1.0/24`) && !ClientIP(`192.168.1.1`)"
      - "traefik.http.routers.homebridge-local.entrypoints=https"
      - "traefik.http.routers.homebridge-local.service=homebridge-svc"
      - "traefik.http.services.homebridge-svc.loadbalancer.server.port=8581"
      - "kop.homebridge.bind.ip=192.168.1.241"

  octoeverywhere-bambu-connect:
    container_name: octoeverywhere
    image: octoeverywhere/octoeverywhere:5.4.1
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/bambu-connect:/data
    environment:
      - ACCESS_CODE=${WONDERTAINMENT_ACCESS_CODE}
      - SERIAL_NUMBER=${WONDERTAINMENT_SERIAL_NUMBER}
      - PRINTER_IP=192.168.6.52
    env_file:
      - .env
    networks:
      public:

  retroassembly:
    container_name: retroassembly
    image: arianrhodsandlot/retroassembly:v7.261011.1345
    restart: unless-stopped
    ports:
      - "3128:8000"
    volumes:
      - ${DOCKER_DATA_DIR}/retroassembly:/app/data
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.retroassembly.rule=Host(`retroassembly.${DOMAIN}`)"
      - "traefik.http.routers.retroassembly.entrypoints=https"
      - "traefik.http.services.retroassembly.loadbalancer.server.port=3128"

  spoolman:
    container_name: spoolman
    image: ghcr.io/donkie/spoolman:0.27.0
    restart: unless-stopped
    ports:
      - "8000:8000/tcp"
    volumes:
      - ${DOCKER_DATA_DIR}/spoolman:/home/app/.local/share/spoolman:rw
    env_file:
      - .env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spoolman.rule=Host(`spoolman.${DOMAIN}`)"
      - "traefik.http.routers.spoolman.entrypoints=https"
      - "traefik.http.routers.spoolman.service=spoolman-svc"
      - "traefik.http.routers.spoolman.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.spoolman-local.rule=Host(`spoolman.${DOMAIN}`) && ClientIP(`192.168.1.0/24`) && !ClientIP(`192.168.1.1`)"
      - "traefik.http.routers.spoolman-local.entrypoints=https"
      - "traefik.http.routers.spoolman-local.service=spoolman-svc"
      - "traefik.http.routers.spoolman-api.rule=Host(`spoolman.${DOMAIN}`) && PathPrefix(`/api/`) && ClientIP(`192.168.0.0/16`)"
      - "traefik.http.routers.spoolman-api.entrypoints=https"
      - "traefik.http.routers.spoolman-api.service=spoolman-svc"
      - "traefik.http.services.spoolman-svc.loadbalancer.server.port=8000"

networks:
  macvlan_1:
    name: macvlan_1
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

  public:
    name: public
    external: true
