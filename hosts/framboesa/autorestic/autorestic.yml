version: 2

backends:
  rsyncnet:
    type: sftp
    path: "rsyncnet:framboesa-backup"

  datengrab:
    type: sftp
    path: "datengrab:pi_backups/framboesa"

locations:
  framboesa-data:
    from:
      - /backup_source
    to:
      - rsyncnet
      - datengrab
    cron: "0 1 * * *"
    options:
      forget:
        keep-daily: 7
        keep-weekly: 4
        keep-monthly: 6
      backup:
        tag:
          - framboesa
        exclude:
          # Standard SQLite extensions
          - "*.db"
          - "*.db-wal"
          - "*.db-shm"
          # Django/Python specific SQLite names
          - "db.sqlite3"
          - "db.sqlite3-wal"
          - "db.sqlite3-shm"

          # Ignore logs
          - "*.log"
          - "/**/technitium/stats/**"
          - "spoolman.log.*"

          # Ignore caches
          - "/**/__pycache/**"
          - "*.pyc"
          - ".git"
