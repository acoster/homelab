name: monitoring

services:
  gatus:
    container_name: gatus
    image: twinproduction/gatus:v5.38.0
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/gatus:/data
      - ./gatus.yaml:/gatus.yaml:ro
    environment:
      GATUS_CONFIG_PATH: /gatus.yaml
    env_file:
      - .env
    ports:
      - '8080:8080/tcp'
    networks:
      public:

networks:
  public:
    name: public
    external: true
