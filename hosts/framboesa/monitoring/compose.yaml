name: monitoring

services:
  gatus:
    container_name: gatus
    image: twinproduction/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    restart: unless-stopped
    ports:
      - '8080:8080/tcp'
    volumes:
      - ${DOCKER_DATA_DIR}/gatus:/data
      - ./gatus.yaml:/gatus.yaml:ro
    environment:
      GATUS_CONFIG_PATH: /gatus.yaml
    env_file:
      - .env
    networks:
      public:

  cadvisor:
    container_name: cadvisor
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    restart: unless-stopped
    ports:
      - '8081:8080/tcp'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /dev/disk/:/dev/disk:ro
    env_file:
      - .env
    networks:
      public:
    command:
      - '-disable_metrics=percpu,sched,tcp,udp,diskIO,process,referenced_memory'
      - '-store_container_labels=false'
      - '-whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service'
      - '-docker_only=true'
    devices:
      - /dev/kmsg:/dev/kmsg
    privileged: true

  alloy:
    container_name: alloy
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    restart: unless-stopped
    ports:
      - '12345:12345/tcp'
    volumes:
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - ./config.river:/etc/alloy/config.river:ro
      - ${DOCKER_DATA_DIR}/alloy-data:/var/lib/alloy/data
    env_file:
      - .env
    networks:
      public:
    labels:
      traefik.enable: true
      traefik.http.routers.alloy-framboesa.rule: 'Host(`alloy-framboesa.${DOMAIN}`)'
      traefik.http.routers.alloy-framboesa.entrypoints: https
      traefik.http.routers.alloy-framboesa.middlewares: 'middlewares-authentik@file'
      traefik.http.routers.alloy-framboesa.service: alloy-framboesa-svc
      traefik.http.services.alloy-framboesa-svc.loadbalancer.server.port: 12345
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.river
    user: root

networks:
  public:
    name: public
    external: true
