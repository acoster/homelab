name: monitoring

services:
  gatus:
    container_name: gatus
    image: twinproduction/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    restart: unless-stopped
    ports:
      - '${HOST_IP:?}:8080:8080/tcp'
    volumes:
      - ${DOCKER_DATA_DIR}/gatus:/data
      - ./gatus.yaml:/gatus.yaml:ro
    environment:
      GATUS_CONFIG_PATH: /gatus.yaml
    env_file:
      - .env
    networks:
      public:

  cadvisor:
    extends:
      file: ../../../common/compose.monitoring.yaml
      service: cadvisor
    ports:
      - '${HOST_IP:?}:8081:8080/tcp'
    volumes:
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    env_file:
      - .env
    networks:
      public:

  alloy:
    extends:
      file: ../../../common/compose.monitoring.yaml
      service: alloy
    ports:
      - '${HOST_IP:?}:12345:12345/tcp'
    environment:
      VLOGS_URL: http://192.168.1.212:9428
    env_file:
      - .env
    networks:
      public:
    labels:
      traefik.enable: true
      traefik.http.routers.alloy-framboesa.rule: 'Host(`alloy-framboesa.${DOMAIN}`)'
      traefik.http.routers.alloy-framboesa.entrypoints: https
      traefik.http.routers.alloy-framboesa.middlewares: 'middlewares-authentik@file'
      traefik.http.routers.alloy-framboesa.service: alloy-framboesa-svc
      traefik.http.services.alloy-framboesa-svc.loadbalancer.server.port: 12345

networks:
  public:
    name: public
    external: true
