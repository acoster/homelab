name: infra

services:
  docker-socket-proxy:
    container_name: docker-socket-proxy
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    ports:
      - "3375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - EVENTS=1
      - PING=1
      - VERSION=1
      - INFO=1
    env_file:
      - .env
    networks:
      public:

  technitium:
    container_name: technitium
    image: technitium/dns-server:15.6.2@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/technitium:/etc/dns
    environment:
      DNS_SERVER_DOMAIN: ns1
    env_file:
      - .env
    networks:
      macvlan_5:
        ipv4_address: 192.168.5.202
        ipv6_address: "2a02:169:4bce:2::202"
        mac_address: "46:d0:e8:df:59:1d"
      public:
    hostname: ns1

  traefik-kop:
    container_name: "traefik-kop"
    image: ghcr.io/jittering/traefik-kop:0.21.0@sha256:ba7595e054e1d1831f17a3cd4e016e802ce9923a7f9843eb8f66dc5010469740
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      REDIS_TTL: 1800
      KOP_HOSTNAME: framboesa
      REDIS_ADDR: 192.168.1.212:6379
      BIND_IP: 192.168.1.39
      REDIS_PASS: ${REDIS_PASSWORD}
    env_file:
      - .env
    networks:
      public:

networks:
  macvlan_5:
    name: macvlan_5
    driver: macvlan
    enable_ipv6: true
    driver_opts:
      parent: eth0.5
    ipam:
      config:
        - subnet: 192.168.5.0/24
          gateway: 192.168.5.1
        - subnet: "2a02:169:4bce:2::/64"
          gateway: "2a02:169:4bce:2::1"

  public:
    name: public
    driver: bridge
