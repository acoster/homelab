name: infra

services:
  technitium:
    container_name: technitium
    image: technitium/dns-server:15.6.2@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/technitium:/etc/dns
    environment:
      DNS_SERVER_DOMAIN: ns1
    env_file:
      - .env
    networks:
      macvlan_5:
        ipv4_address: 192.168.5.202
        ipv6_address: '2a02:169:4bce:2::202'
        mac_address: '46:d0:e8:df:59:1d'
      public:
    hostname: ns1

  # The only container in this stack with the Docker socket. traefik-kop talks
  # to this filter instead: GET on containers, networks, events and version,
  # nothing else. A `:ro` socket mount would not stop a process from creating
  # containers through the API.
  socket-proxy:
    container_name: socket-proxy
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    privileged: true # upstream's recommendation; needed to connect to the socket under SELinux/AppArmor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONTAINERS: '1'
      NETWORKS: '1' # containers on several networks
      # EVENTS, PING and VERSION are on by default; POST and everything else is off.
    networks:
      socket-proxy:

  traefik-kop:
    container_name: 'traefik-kop'
    image: ghcr.io/jittering/traefik-kop:0.21.0@sha256:ba7595e054e1d1831f17a3cd4e016e802ce9923a7f9843eb8f66dc5010469740
    restart: unless-stopped
    depends_on:
      - socket-proxy
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      REDIS_TTL: 1800
      KOP_HOSTNAME: framboesa
      REDIS_USER: kop
      REDIS_ADDR: 192.168.1.212:6379
      BIND_IP: ${HOST_IP:?}
      REDIS_PASS: ${REDIS_KOP_PASSWORD}
    env_file:
      - .env
    networks:
      public:
      socket-proxy:

  bambulab-relay:
    container_name: 'bambulab-relay'
    image: fingerhutascode/udp-broadcast-relay:latest@sha256:588ed7b74cc59681160cc2bc2d173c65521143b3bd8b4b0b943031eabf0e0210
    restart: unless-stopped
    # h/t to https://nuxx.net/blog/2024/12/19/bambu-lab-p1s-on-iot-vlan/ for
    # figuring out the settings.
    environment:
      RELAY_ID: 1
      BROADCAST_PORT: 2021
      INTERFACES: 'eth0,eth0.6'
      SPOOF_SOURCE: '1.1.1.2'
      MULTICAST_GROUP: '239.255.255.250'
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host

networks:
  socket-proxy:
    name: socket-proxy
    internal: true
  macvlan_5:
    name: macvlan_5
    driver: macvlan
    enable_ipv6: true
    driver_opts:
      parent: eth0.5
    ipam:
      config:
        - subnet: 192.168.5.0/24
          gateway: 192.168.5.1
        - subnet: '2a02:169:4bce:2::/64'
          gateway: '2a02:169:4bce:2::1'

  public:
    name: public
    driver: bridge
