name: doco-cd

services:
  doco-cd:
    extends:
      file: ../../../common/compose.doco-cd.yaml
      service: doco-cd
    ports:
      - '${HOST_IP:?}:9000:80'
      - '${HOST_IP:?}:9120:9120'
    environment:
      POLL_CONFIG: |
        - url: https://github.com/acoster/homelab.git
          reference: main
          interval: 1800
          target: framboesa
    labels:
      traefik.enable: 'true'
      traefik.http.routers.wh-framboesa.rule: Host(`${WEBHOOK_HOST}.${DOMAIN}`)
      traefik.http.routers.wh-framboesa.entrypoints: https
      traefik.http.services.wh-framboesa.loadbalancer.server.port: '9000'
