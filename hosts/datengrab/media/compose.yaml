name: media

services:
  lidarr:
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:version-3.1.6.5079@sha256:9fddcf5c613361edfce390d4e6b7c364282e71e90a40ce7793077fed788f6e63
    restart: unless-stopped
    depends_on:
      - prowlarr
      - sabnzbd
      - transmission
    ports:
      - "8686:8686"
    volumes:
      - ${DOCKER_DATA_DIR}/lidarr:/config
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.${DOMAIN}`)"
      - "traefik.http.routers.lidarr.entrypoints=https"
      - "traefik.http.routers.lidarr.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.lidarr.service=lidarr-svc"
      - "traefik.http.routers.lidarr-local.rule=Host(`lidarr.${DOMAIN}`) && ClientIP(`192.168.1.0/24`) && !ClientIP(`192.168.1.1`)"
      - "traefik.http.routers.lidarr-local.entrypoints=https"
      - "traefik.http.routers.lidarr-local.service=lidarr-svc"
      - "traefik.http.routers.lidarr-api.rule=Host(`lidarr.${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/ping`))"
      - "traefik.http.routers.lidarr-api.entrypoints=https"
      - "traefik.http.routers.lidarr-api.service=lidarr-svc"
      - "traefik.http.services.lidarr-svc.loadbalancer.server.port=8686"

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/jellyfin/cache:/cache
      - ${DOCKER_DATA_DIR}/jellyfin/config:/config
      - ${MEDIA_DIR}:/media
    env_file:
      - ./.env
    networks:
      public:
      media-macvlan:
        ipv4_address: "192.168.1.231"
    labels:
      - "kop.jellyfin-svc.bind.ip=192.168.1.231"
      - "traefik.enable=true"
      - "traefik.docker.network=media-macvlan"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=https"
      - "traefik.http.routers.jellyfin.service=jellyfin-svc"
      - "traefik.http.routers.jellyfin.middlewares=jellyfin-headers"

      # Service
      - "traefik.http.services.jellyfin-svc.loadbalancer.server.port=8096"
      - "traefik.http.services.jellyfin-svc.loadbalancer.passhostheader=true"
      - "traefik.http.services.jellyfin-svc.loadbalancer.responseforwarding.flushinterval=100ms"
      - "traefik.http.services.jellyfin-svc.loadbalancer.serverstransport=jellyfin-transport@file"

      # Headers
      - "traefik.http.middlewares.jellyfin-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.jellyfin-headers.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow, nosnippet, noarchive"
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "937"
    user: "297536:297536"

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:2.7.0@sha256:04be30163fbaf48d6aeee7b5893c9f6614ffbad6d853971df0d6dcdf01c7f104
    restart: unless-stopped
    depends_on:
      - sabnzbd
      - transmission
    ports:
      - "9696:9696"
    volumes:
      - ${DOCKER_DATA_DIR}/prowlarr:/config
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=https"
      - "traefik.http.routers.prowlarr.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.prowlarr.service=prowlarr-svc"
      - "traefik.http.routers.prowlarr-local.rule=Host(`prowlarr.${DOMAIN}`) && ClientIP(`192.168.1.0/24`) && !ClientIP(`192.168.1.1`)"
      - "traefik.http.routers.prowlarr-local.entrypoints=https"
      - "traefik.http.routers.prowlarr-local.service=prowlarr-svc"
      - "traefik.http.routers.prowlarr-api.rule=Host(`prowlarr.${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/ping`))"
      - "traefik.http.routers.prowlarr-api.entrypoints=https"
      - "traefik.http.routers.prowlarr-api.service=prowlarr-svc"
      - "traefik.http.services.prowlarr-svc.loadbalancer.server.port=9696"

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.4.4@sha256:084b3b2ab1d0ef930660727259546a241f2bdf67c9ed085d54bf1486a6887c9b
    restart: unless-stopped
    depends_on:
      - prowlarr
      - sabnzbd
      - transmission
    ports:
      - "7878:7878"
    volumes:
      - ${DOCKER_DATA_DIR}/radarr:/config
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=https"
      - "traefik.http.routers.radarr.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.radarr.service=radarr-svc"
      - "traefik.http.routers.radarr-local.rule=Host(`radarr.${DOMAIN}`) && ClientIP(`192.168.1.0/24`) && !ClientIP(`192.168.1.1`)"
      - "traefik.http.routers.radarr-local.entrypoints=https"
      - "traefik.http.routers.radarr-local.service=radarr-svc"
      - "traefik.http.routers.radarr-api.rule=Host(`radarr.${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/ping`))"
      - "traefik.http.routers.radarr-api.entrypoints=https"
      - "traefik.http.routers.radarr-api.service=radarr-svc"
      - "traefik.http.services.radarr-svc.loadbalancer.server.port=7878"

  sabnzbd:
    container_name: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:5.1.3@sha256:a7cfba459929f73b83c98b476a845076dc72524af80b24fcb4200684e6b1b675
    restart: unless-stopped
    ports:
      - "3128:8080"
    volumes:
      - ${DOCKER_DATA_DIR}/sabnzbd:/config
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${DOMAIN}`)"
      - "traefik.http.routers.sabnzbd.entrypoints=https"
      - "traefik.http.routers.sabnzbd.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.sabnzbd.service=sabnzbd-svc"
      - "traefik.http.routers.sabnzbd-local.rule=Host(`sabnzbd.${DOMAIN}`) && ClientIP(`192.168.1.0/24`) && !ClientIP(`192.168.1.1`)"
      - "traefik.http.routers.sabnzbd-local.entrypoints=https"
      - "traefik.http.routers.sabnzbd-local.service=sabnzbd-svc"
      - "traefik.http.routers.sabnzbd-api.rule=Host(`sabnzbd.${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.sabnzbd-api.entrypoints=https"
      - "traefik.http.routers.sabnzbd-api.service=sabnzbd-svc"
      - "traefik.http.services.sabnzbd-svc.loadBalancer.server.port=3128"

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:4.0.20@sha256:386c962ee6e260e3a5656b25df2ed056bcc9b6410e197d075f9547fd14c23bca
    restart: unless-stopped
    depends_on:
      - prowlarr
      - sabnzbd
      - transmission
    ports:
      - "8989:8989"
    volumes:
      - ${DOCKER_DATA_DIR}/sonarr:/config
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=https"
      - "traefik.http.routers.sonarr.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.sonarr.service=sonarr-svc"
      - "traefik.http.routers.sonarr-local.rule=Host(`sonarr.${DOMAIN}`) && ClientIP(`192.168.1.0/24`) && !ClientIP(`192.168.1.1`)"
      - "traefik.http.routers.sonarr-local.entrypoints=https"
      - "traefik.http.routers.sonarr-local.service=sonarr-svc"
      - "traefik.http.routers.sonarr-api.rule=Host(`sonarr.${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/ping`))"
      - "traefik.http.routers.sonarr-api.entrypoints=https"
      - "traefik.http.routers.sonarr-api.service=sonarr-svc"
      - "traefik.http.services.sonarr-svc.loadbalancer.server.port=8989"

  transmission:
    container_name: transmission
    image: lscr.io/linuxserver/transmission:4.1.4@sha256:5b3c27a96c8a37c878a525ebf377a32032c3a3acfe845ecaa7c3eb10b09c2caa
    restart: unless-stopped
    ports:
      - "9091:9091"
      - "51413:51413/tcp"
      - "51413:51413/udp"
    volumes:
      - ${DOCKER_DATA_DIR}/transmission-watch:/watch
      - ${DOCKER_DATA_DIR}/transmission:/config
      - ${MEDIA_DIR}/incoming:/downloads
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
      USER: ${TRANSMISSION_USER}
      PASS: ${TRANSMISSION_PASS}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`transmission.${DOMAIN}`)"
      - "traefik.http.routers.transmission.entrypoints=https"
      - "traefik.http.routers.transmission.service=transmission-svc"
      - "traefik.http.routers.transmission.middlewares=middlewares-authentik@file,transmission-auth"
      - "traefik.http.routers.transmission-local.rule=Host(`transmission.${DOMAIN}`)"
      - "traefik.http.routers.transmission-local.entrypoints=https"
      - "traefik.http.routers.transmission-local.service=transmission-svc"
      - "traefik.http.routers.transmission-local.middlewares=transmission-auth"
      - "traefik.http.middlewares.transmission-auth.headers.customrequestheaders.authorization=Basic ${TRANSMISSION_AUTH}"
      - "traefik.http.services.transmission-svc.loadbalancer.server.port=9091"

networks:
  public:
    name: public
    external: true
  media-internal:
    internal: true
  media-macvlan:
    name: media-macvlan
    driver: macvlan
    driver_opts:
      parent: bond0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
