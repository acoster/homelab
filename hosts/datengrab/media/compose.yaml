name: media

services:
  lidarr:
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:version-3.1.6.5079
    restart: unless-stopped
    depends_on:
      - prowlarr
      - sabnzbd
      - transmission
    ports:
      - "8686:8686"
    volumes:
      - ${DOCKER_DATA_DIR}/lidarr:/config
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.${DOMAIN}`)"
      - "traefik.http.routers.lidarr.entrypoints=https"
      - "traefik.http.routers.lidarr.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.lidarrApi.rule=Host(`lidarr.${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/ping`))"
      - "traefik.http.routers.lidarrApi.entrypoints=https"

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:12.4
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/jellyfin/cache:/cache
      - ${DOCKER_DATA_DIR}/jellyfin/config:/config
      - ${MEDIA_DIR}:/media
    env_file:
      - ./.env
    networks:
      public:
      media-macvlan:
        ipv4_address: "192.168.1.231"
    labels:
      - "kop.jellyfin-svc.bind.ip=192.168.1.231"
      - "traefik.enable=true"
      - "traefik.docker.network=media-macvlan"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=https"
      - "traefik.http.routers.jellyfin.service=jellyfin-svc"
      - "traefik.http.routers.jellyfin.middlewares=jellyfin-headers"

      # Service
      - "traefik.http.services.jellyfin-svc.loadbalancer.server.port=8096"
      - "traefik.http.services.jellyfin-svc.loadbalancer.passhostheader=true"
      - "traefik.http.services.jellyfin-svc.loadbalancer.responseforwarding.flushinterval=100ms"
      - "traefik.http.services.jellyfin-svc.loadbalancer.serverstransport=jellyfin-transport@file"

      # Headers
      - "traefik.http.middlewares.jellyfin-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.jellyfin-headers.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow, nosnippet, noarchive"
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "937"
    user: "297536:297536"

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:2.7.0
    restart: unless-stopped
    depends_on:
      - sabnzbd
      - transmission
    ports:
      - "9696:9696"
    volumes:
      - ${DOCKER_DATA_DIR}/prowlarr:/config
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=https"
      - "traefik.http.routers.prowlarr.service=prowlarr-svc"
      - "traefik.http.routers.prowlarr.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.prowlarr-local.rule=Host(`prowlarr.${DOMAIN}`) && ClientIP(`192.168.1.0/24`) && !ClientIP(`192.168.1.1`)"
      - "traefik.http.routers.prowlarr-local.entrypoints=https"
      - "traefik.http.routers.prowlarr-local.service=prowlarr-svc"
      - "traefik.http.routers.prowlarrApi.rule=Host(`prowlarr.${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/ping`))"
      - "traefik.http.routers.prowlarrApi.entrypoints=https"
      - "traefik.http.routers.prowlarrApi.service=prowlarr-svc"
      - "traefik.http.services.prowlarr-svc.loadbalancer.server.port=9696"

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.4.4
    restart: unless-stopped
    depends_on:
      - prowlarr
      - sabnzbd
      - transmission
    ports:
      - "7878:7878"
    volumes:
      - ${DOCKER_DATA_DIR}/radarr:/config
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=https"
      - "traefik.http.routers.radarr.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.radarrApi.rule=Host(`radarr.${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/ping`))"
      - "traefik.http.routers.radarrApi.entrypoints=https"

  sabnzbd:
    container_name: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:5.1.3
    restart: unless-stopped
    ports:
      - "3128:8080"
    volumes:
      - ${DOCKER_DATA_DIR}/sabnzbd:/config
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - traefik.port=3128
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${DOMAIN}`)"
      - "traefik.http.routers.sabnzbd.entrypoints=https"
      - "traefik.http.routers.sabnzbd.middlewares=middlewares-authentik@file"
      - "traefik.http.services.sabnzbd.loadBalancer.server.port=3128"
      - "traefik.http.routers.sabnzbdApi.rule=Host(`sabnzbd.${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.sabnzbdApi.entrypoints=https"

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:4.0.20
    restart: unless-stopped
    depends_on:
      - prowlarr
      - sabnzbd
      - transmission
    ports:
      - "8989:8989"
    volumes:
      - ${DOCKER_DATA_DIR}/sonarr:/config
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=https"
      - "traefik.http.routers.sonarr.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.sonarrApi.rule=Host(`sonarr.${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/ping`))"
      - "traefik.http.routers.sonarrApi.entrypoints=https"
    devices:
      - "/dev/dri:/dev/dri"

  transmission:
    container_name: transmission
    image: lscr.io/linuxserver/transmission:4.1.3
    restart: unless-stopped
    ports:
      - "9091:9091"
      - "51413:51413/tcp"
      - "51413:51413/udp"
    volumes:
      - ${DOCKER_DATA_DIR}/transmission-watch:/watch
      - ${DOCKER_DATA_DIR}/transmission:/config
      - ${MEDIA_DIR}/incoming:/downloads
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
      USER: ${TRANSMISSION_USER}
      PASS: ${TRANSMISSION_PASS}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`transmission.${DOMAIN}`)"
      - "traefik.http.routers.transmission.entrypoints=https"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"
      - "traefik.http.routers.transmission.middlewares=middlewares-authentik@file,add-auth-header"
      - "traefik.http.middlewares.add-auth-header.headers.customrequestheaders.authorization=Basic ${TRANSMISSION_AUTH}"

networks:
  public:
    name: public
    external: true
  media-internal:
    internal: true
  media-macvlan:
    name: media-macvlan
    driver: macvlan
    driver_opts:
      parent: bond0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
