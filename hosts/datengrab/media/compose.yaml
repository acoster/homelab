name: media

services:

  lidarr:
    image: lscr.io/linuxserver/lidarr:version-3.1.0.4875
    container_name: lidarr
    depends_on:
      - prowlarr
      - sabnzbd
      - transmission
    volumes:
      - ${DOCKER_DATA_DIR}/lidarr:/config
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    ports:
      - '8686:8686'
    networks:
      public:
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.${DOMAIN}`)"
      - "traefik.http.routers.lidarr.entrypoints=https"
      - "traefik.http.routers.lidarr.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.lidarrApi.rule=Host(`lidarr.${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/ping`))"
      - "traefik.http.routers.lidarrApi.entrypoints=https"

  plex:
    image: lscr.io/linuxserver/plex:1.43.5
    container_name: plex
    volumes:
      - ${DOCKER_DATA_DIR}/plex:/config
      - ${MEDIA_DIR}:/Media
    environment:
      - PUID=297536
      - PGID=297536
      - VERSION=latest
    env_file:
      - ./.env
    networks:
      public:
      media-macvlan:
        ipv4_address: "192.168.1.245"
    restart: unless-stopped
    devices:
      - "/dev/dri:/dev/dri"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: prowlarr
    depends_on:
      - sabnzbd
      - transmission
    volumes:
      - ${DOCKER_DATA_DIR}/prowlarr:/config
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    ports:
      - '9696:9696'
    networks:
      public:
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=https"
      - "traefik.http.routers.prowlarr.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.prowlarrApi.rule=Host(`prowlarr.${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/ping`))"
      - "traefik.http.routers.prowlarrApi.entrypoints=https"

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    depends_on:
      - prowlarr
      - sabnzbd
      - transmission
    volumes:
      - ${DOCKER_DATA_DIR}/radarr:/config
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    ports:
      - '7878:7878'
    networks:
      public:
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=https"
      - "traefik.http.routers.radarr.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.radarrApi.rule=Host(`radarr.${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/ping`))"
      - "traefik.http.routers.radarrApi.entrypoints=https"
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3
    container_name: sabnzbd
    volumes:
      - ${DOCKER_DATA_DIR}/sabnzbd:/config
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    ports:
      - '3128:8080'
    networks:
      public:
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - traefik.port=3128
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${DOMAIN}`)"
      - "traefik.http.routers.sabnzbd.entrypoints=https"
      - "traefik.http.routers.sabnzbd.middlewares=middlewares-authentik@file"
      - "traefik.http.services.sabnzbd.loadBalancer.server.port=3128"
      - "traefik.http.routers.sabnzbdApi.rule=Host(`sabnzbd.${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.sabnzbdApi.entrypoints=https"

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    depends_on:
      - prowlarr
      - sabnzbd
      - transmission
    volumes:
      - ${DOCKER_DATA_DIR}/sonarr:/config
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
    env_file:
      - ./.env
    ports:
      - '8989:8989'
    networks:
      public:
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=https"
      - "traefik.http.routers.sonarr.middlewares=middlewares-authentik@file"
      - "traefik.http.routers.sonarrApi.rule=Host(`sonarr.${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/ping`))"
      - "traefik.http.routers.sonarrApi.entrypoints=https"
    devices:
      - "/dev/dri:/dev/dri"

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3
    container_name: transmission
    volumes:
      - ${DOCKER_DATA_DIR}/transmission-watch:/watch
      - ${DOCKER_DATA_DIR}/transmission:/config
      - ${MEDIA_DIR}/incoming:/downloads
      - ${MEDIA_DIR}:/Media
    environment:
      PGID: ${MEDIA_PGID}
      PUID: ${MEDIA_PUID}
      USER: ${TRANSMISSION_USER}
      PASS: ${TRANSMISSION_PASS}
    env_file:
      - ./.env
    ports:
      - '9091:9091'
      - '51413:51413/tcp'
      - '51413:51413/udp'
    networks:
      public:
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`transmission.${DOMAIN}`)"
      - "traefik.http.routers.transmission.entrypoints=https"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"
      - "traefik.http.routers.transmission.middlewares=middlewares-authentik@file,add-auth-header"
      - "traefik.http.middlewares.add-auth-header.headers.customrequestheaders.authorization=Basic ${TRANSMISSION_AUTH}"

networks:
  public:
    name: public
    external: true

  media-macvlan:
    name: media-macvlan
    driver: macvlan
    driver_opts:
      parent: bond0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
