name: monitoring

services:
  cadvisor:
    extends:
      file: ../../../common/compose.monitoring.yaml
      service: cadvisor
    ports:
      - '${HOST_IP:?}:8787:8080/tcp'
    volumes:
      - /var/packages/ContainerManager/var/docker/:/var/lib/docker:ro
    networks:
      public:

  alloy:
    extends:
      file: ../../../common/compose.monitoring.yaml
      service: alloy
    ports:
      - '${HOST_IP:?}:12345:12345/tcp'
    environment:
      VLOGS_URL: http://192.168.1.212:9428
    env_file:
      - .env
    networks:
      public:
    labels:
      traefik.enable: true
      traefik.http.routers.alloy-datengrab.rule: 'Host(`alloy-datengrab.${DOMAIN}`)'
      traefik.http.routers.alloy-datengrab.entrypoints: https
      traefik.http.routers.alloy-datengrab.middlewares: 'middlewares-authentik@file'
      traefik.http.routers.alloy-datengrab.service: alloy-datengrab-svc
      traefik.http.services.alloy-datengrab-svc.loadbalancer.server.port: 12345

networks:
  public:
    name: public
    external: true
