name: apps

services:
  bambu-slicer-api:
    container_name: bambu-slicer-api
    image: ghcr.io/maziggy/bambu-studio-api:bambuddy-1.2.5.7@sha256:4a104e34e81137f092c84af92814cc39cfa74cdd1fec4b6f6aa0d0464b568a91
    restart: unless-stopped
    ports:
      - '${HOST_IP:?}:3003:3000'
    volumes:
      - ${DOCKER_DATA_DIR}/bambu:/app/data
    environment:
      NODE_ENV: production
      PORT: '3000'
      MAX_MODEL_UPLOAD_MB: '512'
    env_file:
      - ./.env
    networks:
      public:
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  bricktracker:
    container_name: bricktracker
    image: gitea.baerentsen.space/frederikbaerentsen/bricktracker:1.4.2@sha256:296c03b0cd30c96acc7f8914bfb9d1087600bb01586251df58fe3d74dda735df
    restart: always
    ports:
      - '${HOST_IP:?}:3333:3333'
    volumes:
      - ${DOCKER_DATA_DIR}/bricktracker/data/:/app/data
    environment:
      BK_REBRICKABLE_API_KEY:
      BK_DOMAIN_NAME: https://bricktracker.${DOMAIN}
    env_file:
      - ./.env
    networks:
      public:
    labels:
      traefik.enable: 'true'
      traefik.http.routers.bricktracker.rule: Host(`bricktracker.${DOMAIN}`)
      traefik.http.routers.bricktracker.middlewares: middlewares-authentik@file
      traefik.http.services.bricktracker.loadbalancer.server.port: '3333'

  gyroidvault:
    container_name: gyroidvault
    image: ghcr.io/teecodedev/gyroidvault:v2.4.0@sha256:d6ceb4b9527eeeb79f3c89acf598403bca3a51ed3e35a0d7ecac7cb2d6672d33
    restart: unless-stopped
    ports:
      - '${HOST_IP:?}:4000:3000/tcp'
    volumes:
      - ${DOCKER_DATA_DIR}/gyroidvault:/app/data
      - /volume1/3DPrinting:/library
    environment:
      LIBRARY_PATH: /library
      JWT_SECRET: ${GYROIDVAULT_SECRET}
      NODE_ENV: production
    env_file:
      - ./.env
    networks:
      public:
    labels:
      traefik.enable: 'true'
      traefik.http.routers.gyroidvault.rule: Host(`gyroidvault.${DOMAIN}`)
      traefik.http.routers.gyroidvault.service: gyroidvault-svc
      traefik.http.services.gyroidvault-svc.loadbalancer.server.port: '4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  public:
    name: public
    external: true
