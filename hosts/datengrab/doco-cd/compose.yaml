name: doco-cd

services:
  doco-cd:
    extends:
      file: ../../../common/compose.doco-cd.yaml
      service: doco-cd
    ports:
      - '9000:80'
    environment:
      POLL_CONFIG: |
        - url: https://github.com/acoster/homelab.git
          reference: main
          interval: 1800
          target: datengrab
    labels:
      traefik.enable: 'true'
      traefik.http.routers.gancho-datengrab.rule: Host(`${WEBHOOK_HOST}.${DOMAIN}`)
      traefik.http.routers.gancho-datengrab.entrypoints: https
      traefik.http.services.gancho-datengrab.loadbalancer.server.port: '9000'
