name: infra

services:
  traefik-kop:
    container_name: traefik-kop
    image: ghcr.io/jittering/traefik-kop:0.21.0@sha256:ba7595e054e1d1831f17a3cd4e016e802ce9923a7f9843eb8f66dc5010469740
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      REDIS_ADDR: "192.168.1.212:6379"
      BIND_IP: "192.168.1.14"
      REDIS_PASS: ${REDIS_PASS}
      REDIS_TTL: 1800
      KOP_HOSTNAME: datengrab
    networks:
      public:

networks:
  public:
    name: public
    driver: bridge
